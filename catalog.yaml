    - uuid: 1c9304d4-e2b3-52c9-a3d7-a59003094b38
      title: IT and Cyber Risks Associated with Third Party Service Providers
      description: '1. Operational performance and capacity (including staff competency
        and bench strength to mitigate key-man risks, system infrastructure reliability
        and IT operation management for service quality, strong recovery and resumption
        capability for business continuity). 2. Security requirements to mitigate
        information security risks relating to secure handling of confidential information
        pertaining to the financial institution, its customers or counterparty during
        transmission, process or storage of such information- (a) security governance;
        (b) IT asset management and protection against evolving cyber threats. This
        includes ensuring the storage of its data is at least logically segregated
        from the other clients of the third party service provider; (c) secure system
        development lifecycle; (d) physical security; (e) personnel security; (f)
        access management; and (g) incident management. 3. Cyber supply chain risks:
