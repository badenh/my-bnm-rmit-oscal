    - uuid: d29d0282-3bb4-5c8c-89a3-b03d64ce78e1
      title: Criteria for Simplified Notification for IT Services Enhancements
      description: 'Guiding principles for simplified notification 1. Where the enhancement
        does not result in: (a) any introduction of new technology to the institution
        or industry; (b) any material changes in application architecture or network
        design (e.g. changes to cybersecurity tools, add-on features to existing digital
        services channel or existing approved platform such as loan applications,
        new non-complex activity e.g. chatbot); or (c) the transmission of confidential
        or sensitive data (e.g. motor underwriting engine by third party for calculation
        of motor premium). 2. Service expansion leveraging approved website / mobile
        application for digital services within financial group. 3. Integration with
        IT services operated by third party service providers that are subject to
        regulation by local or foreign authorities (“regulated entities”). Non-exhaustive
