        media-type: application/pdf
    - uuid: 4f2e10e6-2fe3-5cfb-a489-7736916c5c24
      title: Control Measures for Mobile Applications and Devices
      description: '1. A financial institution that offers digital services must be
        aware of the risks associated with mobile applications. To mitigate these
        risks, a financial institution shall continuously assess and perform risk
        assessment to ensure that the threats associated with mobile applications
        is addressed. 2. A financial institution must ensure digital services involving
        sensitive customer and counterparty information offered via mobile devices
        are adequately secured. This includes the following: (a) design the mobile
        application to operate in a secure and tamper-proof environment within the
        mobile devices to protect users against cyber threats such as malware and
        unauthorised access; (b) prohibit mobile applications from storing customer
        and counterparty information used for authentication with the application
        server such as PIN and passwords. Authentication and verification of unique
        key and PIN must be centralised at the host; (c) activation of the mobile
        application must be subject to robu'
      props:
      - name: label
        value: appendix-4
        ns: https://baden.id/ns/rmit
      - name: type
        value: appendix
        ns: https://baden.id/ns/rmit
      - name: source-page
        value: '50'
        ns: https://baden.id/ns/rmit
      rlinks:
      - href: https://www.bnm.gov.my/documents/20124/938039/pd-rmit-sep26.pdf#page=50
        media-type: application/pdf
    - uuid: 1cdf5324-d206-5922-aef8-c2429e5b0878
      title: Control Measures on Cybersecurity
      description: 'A financial institution must adopt robust control measures to
        enhance its network resilience against cyber threats. Part A: Network Security
        1. A financial institution must ensure technology networks are segregated
        into multiple zones according to threat profile. Each zone shall be adequately
        protected by various security devices including but not limited to firewall
        and Intrusion Prevention System (IPS). This must include network for delivery
        of digital services and wireless networks as well. 2. A financial institution
        must ensure security controls for server-to-server external network connections
        include the following: (a) use PKI-based authentication method or equivalent
        alternatives; (b) use of secure tunnels such as Transport Layer Security (TLS)
        and Virtual Private Network (VPN) IPSec; and (c) deploying staging servers
        with adequate perimeter defences and protection such as firewall, IPS and
        antivirus. 3. A financial institution must ensure security controls for remote
        access to '
      props:
      - name: label
        value: appendix-5
