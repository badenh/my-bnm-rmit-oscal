    - uuid: 4d448423-691a-537c-a8ba-fff63fe40fb8
      title: Control Measures on Self-service Terminals (SSTs)
      description: 'Cash SST Cash SSTs are computer terminals provided by banking
        institutions such as Automated Teller Machine, Cash Deposit Machine and Cash
        Recycler Machine that provide cash transactions such as cash withdrawals and
        deposits including in foreign currencies. Financial institutions must ensure
        the adequacy of physical and logical security and controls implemented on
        the Cash SST, which includes- 1. enforcing full hard disk encryption; 2. retaining
        cards or block access to Cash SST service when the following are detected:
        (a) exceed maximum PIN attempts; (b) invalid card authentication value; (c)
        cash SST card unable to eject; (d) “deactivated” card status; (e) inactive
        account status such as “Dormant” or “Deceased”; and (f) cards tagged as “Lost”
        or “Stolen”; 3. deploying antivirus solution for Cash SST, ensure full virus
        scanning on all Cash SSTs is performed periodically and ensuring timely update
        of signatures; 4. implementing a centralised management system to monitor
        and alert any u'
      props:
      - name: label
        value: appendix-2
        ns: https://baden.id/ns/rmit
