        props:
        - name: label
          value: '4.1'
        - name: source-page
          value: '4'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-4.1_smt
          name: statement
          prose: This policy document comes into effect on 28 November 2025 except
