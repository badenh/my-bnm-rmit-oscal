    - uuid: a5c75f33-57fe-5f2f-8eb6-e55d298cec1d
      title: Key Risks and Control Measures for Cloud Services
      description: 'This appendix provides additional guidance to financial institutions
        for the assessment of common key risks and considerations of control measures
        when financial institutions adopt public cloud for critical systems. The guidance
        is broadly applicable across various cloud service models and financial institutions
        is expected to apply a risk- based approach in implementing the guidance.
        The guidance consists of two (2) parts: • Part A: Cloud governance – describes
        the considerations governing the cloud usage policy, and technology skills
        capacity to implement cloud services securely and effectively. • Part B: Cloud
        design and control – describes the considerations related to designing robust
        cloud infrastructure and in operationalising the cloud environment. This places
        emphasis on cloud architecture, cloud application delivery model, high velocity
        software development, user access management, data protection, key management,
        cloud backup and recovery, business continuity management and '
