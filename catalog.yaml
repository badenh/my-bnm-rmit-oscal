    - uuid: f8f2d31b-fceb-5ebf-ab3a-5a7d2e83c27d
      title: Guidance on Emerging Technologies
      description: '1. As the landscape of emerging technology is dynamic and evolving,
        a financial institution shall ensure technology risk management framework
        (TRMF) is effective in monitoring the build-up of risks at the enterprise
        level arising from the use of new technologies. A financial institution shall
        provide clarity in its governance arrangement relating to new technologies
        as follows: (a) appropriate level of caution, factoring the unintended consequences
        such as fairness, ethics, legal liability exposures and frictions to vulnerable
        customers in the risk assessment and tolerance level; (b) acceptance criteria
        for introduction of new technology and reporting structure and oversight mechanism
        to uphold accountability throughout the lifecycle of adoption; (c) enhancement
        of technology and cybersecurity operation controls to mitigate attendant risks;
        and (d) evaluation and improvement of operating control effectiveness on on-
        going basis. 2. A financial institution must only allow the use of eme'
