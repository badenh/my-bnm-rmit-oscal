    - uuid: b140a0f6-aa93-521d-a420-cb265614acd5
      title: Control Measures for Digital Services
      description: '1. A financial institution must ensure the adequacy of security
        controls implemented for digital services, which include the following, where
        relevant: (a) ensure registration or enrolment of digital services is subject
        to robust authentication and verification; (b) ensure transactions are performed
        over secured channels such as the latest version of Transport Layer Security
        (TLS); (c) ensure that both client and host application systems encrypt all
        confidential information prior to transmission over the network; (d) implement
        strong mutual authentication between the users’ end-point devices and financial
        institutions’ servers, such as the use of the latest version of Extended Validation
        SSL certificate (EV SSL); (e) ensure secure user and session handling management;
        (f) ensure sufficient and relevant digital service logs are retained for investigations
        and forensic purposes for at least three years; (g) put in place additional
        authentication protocols to enable customers to identify '
      props:
      - name: label
        value: appendix-3
        ns: https://baden.id/ns/rmit
      - name: type
        value: appendix
        ns: https://baden.id/ns/rmit
