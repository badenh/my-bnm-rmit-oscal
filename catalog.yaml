    - uuid: 4da26333-7f01-5a0d-b186-80b68c3f9cd1
      title: Storage and Transportation of Sensitive Data in Removable Media
      description: 'Financial institutions must ensure adequate controls and measures
        are implemented for the storage and transportation of sensitive data in removable
        media, including: 1. deploying the latest industry-tested and accepted encryption
        techniques; 2. implementing authorised access control to sensitive data (e.g.
        password protection, user access matrix); 3. prohibiting unauthorised copying
        and reading from the media; 4. where there is a need to transport the removable
        media to a different physical location, financial institutions must- (a) strengthen
        the chain of custody processes for media management which includes: (i) the
        media must not be under single custody at any point of time; (ii) the media
        must always be within sight of the designated custodians; and (iii) the media
        must be delivered to its target destination without unscheduled stops or detours;
        (b) use secure and official vehicle for transportation; (c) use strong and
        tamper-proof containers for storing the media with high- securi'
