    - id: rmit-g-5
      class: rmit-section
      title: Interpretation
      props:
      - name: label
        value: '5'
      controls:
      - id: rmit-5.1
        class: provision
        title: RMIT 5.1
        props:
        - name: label
          value: '5.1'
        - name: source-page
          value: '4'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-5.1_smt
          name: statement
          prose: The terms and expressions used in this policy document shall have
            the same meanings assigned to them in the FSA, IFSA, DFIA or MSBA, as
            the case may be, unless otherwise defined in this policy document.
      - id: rmit-5.2
        class: provision
        title: RMIT 5.2
        props:
        - name: label
          value: '5.2'
        - name: source-page
          value: '4'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-5.2_smt
          name: statement
          prose: For purposes of this policy document- “S” denotes a standard, an
            obligation, a requirement, specification, direction, condition and any
            interpretative, supplemental and transitional provisions that must be
            complied with. Non-compliance may result in enforcement action; “G” denotes
            guidance which may consist of statements or information intended to promote
            common understanding and advice or recommendations that are encouraged
            to be adopted; “affiliate” in relation to an entity, refers to any corporation
            that controls, is controlled by, or is under common control with, the
            entity; “board” refers to the board of directors of a financial institution,
            including any committee carrying out any of the responsibilities of the
            board under this policy document; “critical system” refers to any application
            system that supports the provision of critical banking, insurance, takaful,
            payment, investment or trading services, where failure of the system has
            the potential to significantly impair the financial institution’s provision
            of financial services to customers or counterparties, business operations,
            financial position, reputation, or compliance with applicable laws and
            regulatory requirements; “customer and counterparty information” refers
            to any information relating to the affairs or the account, of any customer
            or counterparty of a financial institution in whatever form; “cyber incident”
            refers to a cyber event that adversely affects the cyber security of an
            information system or the information the system processes, stores or
            transmits whether resulting from malicious activity or not; “cyber resilience”
            refers to the ability of people, processes, IT systems, applications,
            platforms or infrastructures to withstand adverse cyber events; “digital
            services” refers to the provision of payment, remittance, banking, Islamic
            banking, insurance or takaful services delivered to customers via electronic
            channels and devices including Internet and mobile devices, self- service
            and point-of-sale terminals; “disruption” refers to an incident that causes
            degradation to the normal performance of a business function that would
            affect a financial institution’s ability to continue its operations and
            services to its customers; “financial institution” refers to- (a) a licensed
            person under the FSA and the IFSA (excluding branches of a foreign professional
            reinsurer and a professional retakaful operator); (b) a prescribed institution
            under the DFIA; (c) an eligible e-money issuer as defined in the policy
            document on Electronic Money issued on 31 January 2025 ; (d) an operator
            of a designated payment system under the FSA and IFSA; (e) a non-bank
            registered merchant acquirer as defined in the policy document on Merchant
            Acquiring Services issued on 15 September 2021 , with a market share of
            at least 5% of the total non-bank merchant acquiring services transaction
            value or volume in Malaysia for a given year; and (f) an intermediary
            remittance institution (IRI) as defined in the policy document on Governance,
            Risk Management, and Operations for Money Services Business (MSB) issued
            on 9 April 2025 , with a market share of at least 5% of total IRI transaction
            value or volume in Malaysia for a given year; “OTP or one-time password”
            refers to an alphanumeric or numeric code represented by a minimum of
            6 characters or digits which is valid only for single use; “senior management”
            refers to the Chief Executive Officer and senior officers, who are employed
            by a financial institution or an affiliate of the financial institution.
            This includes, at minimum, senior management roles listed in Appendix
            2 of policy document of Responsibility Mapping issued on 29 December 2023
            as well as the relevant paragraphs on roles and responsibilities in the
            policy documents on Electronic Money issued on 31 January 2025, Merchant
            Acquiring Services issued on 15 September 2021, Payment System Operator
            issued on 22 December 2022, and Governance, Risk Management, and Operations
            for Money Services Business (MSB) issued on 9 April 2025; “third party
            service provider” refers to any internal group affiliate or external entity
            providing technology-related functions or services directly to enable
            or support a function or service provided by the financial institution,
            or which involves the transmission, processing, storage or handling of
            confidential information pertaining to the financial institution or its
            customers. This includes cloud computing software, platform and infrastructure
            service providers.
    - id: rmit-g-6
      class: rmit-section
      title: Related legal instruments and policy documents
      props:
      - name: label
        value: '6'
      controls:
      - id: rmit-6.1
        class: provision
        title: RMIT 6.1
        props:
        - name: label
          value: '6.1'
        - name: source-page
          value: '6'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-6.1_smt
          name: statement
          prose: This policy document must be read together with any relevant legal
            instruments, policy documents, guidelines, circulars, and supplementary
            documents issued by the Bank, including any amendments and reissuances
            thereafter, in particular- (a) Guidelines on Data Management and MIS Framework
            issued on 23 October 2008; (b) Guidelines on Data Management and MIS Framework
            for Development Financial Institutions issued on 5 November 2012; (c)
            Policy Document on Risk Governance issued on 1 March 2013; (d) Policy
            Document on Introduction of New Products issued on 7 March 2014; (e) Policy
            Document on Compliance issued on 10 May 2016; (f) Policy Document on Operational
            Risk issued on 10 May 2016; (g) Policy Document on Outsourcing issued
            on 23 October 2019; (h) Policy Document on Interoperable Credit Transfer
            Framework issued on 23 December 2019; (i) Policy Document on Merchant
            Acquiring Services issued on 15 September 2021; (j) Policy Document on
            Business Continuity Management issued on 19 December 2022; (k) Policy
            Document on Responsibility Mapping issued on 29 December 2023; (l) Industry
            letter on Updated 2023 Financial Stability Board Cyber Lexicon issued
            on 28 February 2024; (m) Policy Document on Fair Treatment of Financial
            Consumers issued on 27 March 2024; (n) Specifications on Countermeasures
            to Combat E-Money Fraud issued on 8 April 2024; (o) Policy Document on
            Operational Risk Reporting issued on 10 April 2025; (p) Management of
            Customer Information and Permitted Disclosures (MCIPD) issued on 31 October
            2025; (q) Policy Document on Debit Card and Debit Card-i issued on 19
            December 2025; (r) Policy Document on Credit Card and Credit Card-i issued
            on 19 December 2025; and (s) Circular of Notification on Consolidated
            List of Requirements Relating to Technology and Cyber Risk issued on 22
            September 2026.
    - id: rmit-g-7
      class: rmit-section
      title: Policy documents and circulars superseded
      props:
      - name: label
        value: '7'
      controls:
      - id: rmit-7.1
        class: provision
        title: RMIT 7.1
        props:
        - name: label
          value: '7.1'
        - name: source-page
          value: '7'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-7.1_smt
          name: statement
          prose: 'This policy document supersedes the following policy documents,
            guidelines, circulars and notifications: (a) Guidelines on the Provision
            of Electronic Banking (e-banking) Services by Financial Institutions,
            including for the provisions under paragraphs 21, 22 and 26 issued on
            18 November 2019; (b) Specifications on Measures to Combat Electronic
            Banking Fraud dated 23 August 2022; (c) Measures to Combat Fraud Monetised
            via Internet Banking and Mobile Banking dated 31 May 2022; (d) Policy
            Document on Risk Management in Technology (RMiT) issued on'
  - id: rmit-g-part-b
    class: rmit-part
    title: 'Part B: Policy Requirements'
    props:
    - name: label
      value: Part B
    groups:
    - id: rmit-g-8
      class: rmit-section
      title: Governance
      props:
      - name: label
        value: '8'
      controls:
      - id: rmit-8.1
        class: standard
        title: RMIT 8.1
        props:
        - name: label
          value: '8.1'
        - name: source-page
          value: '8'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-8.1_smt
          name: statement
          prose: The board must establish and approve the technology risk appetite
            which is aligned with the financial institution’s risk appetite statement.
            In doing so, the board must- (a) approve the corresponding risk tolerances
            for technology-related events considering potential impact on business
            operations as well as its customers; (b) identify risk owner to ensure
            clear accountability and establish criteria and approving authority for
            the acceptance of residual risks by the institution; (c) ensure key risk
            indicators are identified to monitor existing and emerging risks against
            financial institution’s risk tolerance; (d) ensure sufficiency and appropriate
            deployment of resources; and (e) conduct review of the technology risk
            appetite at regular intervals with sufficient deliberation to ensure such
            risk appetite remains relevant with changing risk environment.
      - id: rmit-8.2
        class: standard
        title: RMIT 8.2
        props:
        - name: label
          value: '8.2'
        - name: source-page
          value: '8'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-8.2_smt
          name: statement
          prose: In discharging its oversight responsibility, the board must- (a)
            approve and review the adequacy of the financial institution’s IT and
            cybersecurity strategic plans to meet business objectives covering a period
            of no less than three years; (b) endorse and oversee the effective implementation
            of a sound and robust technology risk management framework (TRMF) and
            cyber resilience framework (CRF), as required to be developed under paragraphs
            9.1 and 11.2, for the continuity of operations and delivery of financial
            services; (c) require senior management to continuously demonstrate that
            risk assessments undertaken in relation to critical IT systems and use
            of emerging technology are robust and comprehensive, supported with adequate
            control measures and resources to mitigate IT and cyber risks arising
            from the execution of IT strategic plans; (d) ensure IT-related framework,
            policies and guidelines are reviewed at least once every three years (unless
            otherwise stated in this policy document) and apply a depth of review
            that is commensurate with the complexity of the financial institution’s
            operations and changes in the risk environment; and (e) ensure risk management
            framework provide support to robust risk assessments in relation to technology
            related applications submitted to the Bank.
      - id: rmit-8.3
        class: standard
        title: RMIT 8.3
        props:
        - name: label
          value: '8.3'
        - name: source-page
          value: '9'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-8.3_smt
          name: statement
          prose: The board must designate a board-level committee which shall be responsible
            for supporting the board in providing oversight over technology-related
            matters. The composition of the designated committee must include at least
            one member with technology experience and competencies.
      - id: rmit-8.4
        class: standard
        title: RMIT 8.4
        props:
        - name: label
          value: '8.4'
        - name: source-page
          value: '9'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-8.4_smt
          name: statement
          prose: To promote effective discussion at the board level amidst a rapidly
            evolving technology and cyber risk landscape, the board must- (a) obtain
            regular updates on technology risk and cyber threats; (b) allocate sufficient
            time to discuss cyber risks, including the strategic, reputational and
            liquidity risks and impact of operational disruption to stakeholders which
            could arise from an extreme cyber incident. This shall be supported by
            input from external experts where appropriate; and (c) participate in
            relevant cybersecurity awareness and training programmes.
      - id: rmit-8.5
        class: standard
        title: RMIT 8.5
        props:
        - name: label
          value: '8.5'
        - name: source-page
          value: '9'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-8.5_smt
          name: statement
          prose: The board audit committee (BAC) shall be responsible for ensuring
            the effectiveness of the internal technology audit function. This shall
            include ensuring the adequate competence of the audit staff to perform
            technology audits. The BAC shall review and ensure appropriate audit scope,
            procedures and frequency of technology audits. The BAC shall also ensure
            effective oversight over the prompt closure of corrective actions to address
            technology control gaps. Responsibilities of the senior management
      - id: rmit-8.6
        class: standard
        title: RMIT 8.6
        props:
        - name: label
          value: '8.6'
        - name: source-page
          value: '9'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-8.6_smt
          name: statement
          prose: 'The senior management shall bear primary responsibility for the
            day-to- day management of technology risks including cyber risks. In fulfilling
            its responsibilities, senior management must– (a) implement board approved
            TRMF and CRF into specific policies and procedures that are consistent
            with the approved risk appetite and risk tolerance; (b) ensure that the
            crisis management plan for service disruptions provides for timely escalation
            of recovery action, taking into consideration the impact on customers,
            such as: (i) duration of disruption; (ii) number of customers affected
            by a disruption; and (iii) number and value of financial transaction impacted;
            and (c) provide regular updates to the board on the status of key performance
            indicators with pertinent information on the risk controls to facilitate
            informed performance review.'
      - id: rmit-8.7
        class: standard
        title: RMIT 8.7
        props:
        - name: label
          value: '8.7'
        - name: source-page
          value: '10'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-8.7_smt
          name: statement
          prose: 'The senior management must establish a cross-functional committee
            to provide guidance on the financial institution’s technology plans and
            operations. The members of the committee must include senior management
            from both cyber and technology functions, as well as major business units.
            The committee’s responsibilities shall include the following: (a) oversee
            the formulation and effective implementation of the strategic technology
            plan and associated technology policies and procedures; (b) provide timely
            updates to the board on key technology matters ; and (c) approve any deviation
            from technology-related policies after having carefully considered a robust
            assessment of related risks. Material deviations shall be reported to
            the board.'
    - id: rmit-g-9
      class: rmit-section
      title: Technology Risk Management
      props:
      - name: label
        value: '9'
      controls:
      - id: rmit-9.1
        class: standard
        title: RMIT 9.1
        props:
        - name: label
          value: '9.1'
        - name: source-page
          value: '11'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-9.1_smt
          name: statement
          prose: A financial institution must ensure that the TRMF is an integral
            part of the financial institution’s enterprise risk management framework
            (ERM).
      - id: rmit-9.2
        class: standard
        title: RMIT 9.2
        props:
        - name: label
          value: '9.2'
        - name: source-page
          value: '11'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-9.2_smt
          name: statement
          prose: 'The TRMF must include the following: (a) clear definition of technology
            risk; (b) clear responsibilities assigned for the management of technology
            risk at different levels and across functions, with appropriate governance
            and reporting arrangements; (c) the identification of technology risks
            to which the financial institution is exposed, including risks from the
            adoption of new or emerging technology (refer Appendix 9 on Guidance on
            Emerging Technologies); (d) risk classification of all information assets
            / systems based on its criticality; (e) risk measurement and assessment
            approaches and methodologies; (f) risk controls and mitigations; (g) continuous
            monitoring to timely detect and address any material risks; (h) effective
            information system to ensure the technology risk profile remains accurate
            and up to date; (i) identification of key resources and interdependencies
            (including critical third party service providers and their connected
            parties ) which support delivery of critical technology functions; (j)
            undertake scenario analysis to strengthen capacity and readiness to resume
            critical systems under severe conditions; and (k) effective incident management
            policies and procedures to minimise the impact of any service disruption
            on the financial institution and its customers, by restoring the affected
            service or system to a secure and stable state as quickly as possible.'
      - id: rmit-9.3
        class: standard
        title: RMIT 9.3
        props:
        - name: label
          value: '9.3'
        - name: source-page
          value: '11'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-9.3_smt
          name: statement
          prose: A financial institution must establish an independent enterprise-wide
            technology risk management function which is responsible for- (a) implementing
            the TRMF and CRF; (b) advising on critical technology projects and ensuring
            critical issues that may have an impact on the financial institution’s
            risk tolerance are adequately deliberated or escalated in a timely manner;
            and (c) providing independent views to the board and senior management
            on third party assessments , where necessary. Designated Chief Information
            Security Officer
      - id: rmit-9.4
        class: standard
        title: RMIT 9.4
        props:
        - name: label
          value: '9.4'
        - name: source-page
          value: '12'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-9.4_smt
          name: statement
          prose: A financial institution must designate a Chief Information Security
            Officer (CISO) by whatever name called, to be responsible for the technology
            risk management function of the financial institution. The financial institution
            must ensure that the CISO has sufficient authority, independence and resources
            . The CISO shall- (a) be independent from day-to-day technology operations;
            (b) apprise board and senior management of current and emerging technology
            risks which could potentially affect the financial institution’s risk
            profile; (c) have the requisite technical skills in emerging and core
            technologies used by the institution, expertise and experience in audit,
            governance and risk management, strategic planning and execution of IT
            and cybersecurity programs, and third party risk management; and (d) be
            appropriately certified.
      - id: rmit-9.5
        class: standard
        title: RMIT 9.5
        props:
        - name: label
          value: '9.5'
        - name: source-page
          value: '12'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-9.5_smt
          name: statement
          prose: The CISO shall be responsible for ensuring that the financial institution’s
            information assets and technologies are adequately protected, which includes-
            (a) formulating appropriate policies for the effective implementation
            of TRMF and CRF; (b) enforcing compliance with these policies, frameworks
            and other technology-related regulatory requirements; and (c) advising
            senior management on technology risk and security matters, including developments
            in the financial institution’s technology security risk profile in relation
            to its business and operations.
    - id: rmit-g-10
      class: rmit-section
      title: Technology Operations Management
      props:
      - name: label
        value: '10'
      controls:
      - id: rmit-10.1
        class: standard
        title: RMIT 10.1
        props:
        - name: label
          value: '10.1'
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.1_smt
          name: statement
          prose: A financial institution must establish appropriate governance requirements
            commensurate with the risk and complexity of technology projects undertaken.
            This shall include project oversight roles and responsibilities, authority
            and reporting structures, and risk assessments throughout the project
            life cycle.
      - id: rmit-10.2
        class: standard
        title: RMIT 10.2
        props:
        - name: label
          value: '10.2'
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.2_smt
          name: statement
          prose: 'The risk assessments shall identify and address the key risks arising
            from the implementation of technology projects. These include the risks
            that could threaten successful project implementation and the risks that
            a project failure will lead to a broader impact on the financial institution''s
            operational capabilities. At a minimum, due regard shall be given to the
            following areas: (a) the adequacy and competency of resources including
            those of the vendor to effectively implement the project. This shall also
            take into consideration the number, size and duration of significant technology
            projects already undertaken concurrently by the financial institution;
            (b) the complexity of systems to be implemented such as the use of unproven
            or unfamiliar technology and the corresponding risks of integrating the
            new technology into existing systems, managing multiple vendor-proprietary
            technologies, large-scale data migration or cleansing efforts and extensive
            system customisation; (c) the adequacy and configuration of security controls
            throughout the project life cycle to mitigate cybersecurity breaches or
            exposure of confidential data; (d) the comprehensiveness of the user requirement
            specifications to mitigate risks from extensive changes in project scope
            or deficiencies in meeting business needs; (e) the robustness of system
            and user testing strategies to reduce risks of undiscovered system faults
            and functionality errors; (f) the appropriateness of system deployment
            and fallback strategies to mitigate risks from prolonged system stability
            issues; and (g) the adequacy of disaster recovery operational readiness
            following the implementation of new or enhanced systems.'
      - id: rmit-10.3
        class: standard
        title: RMIT 10.3
        props:
        - name: label
          value: '10.3'
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.3_smt
          name: statement
          prose: The board and senior management must receive and review timely reports
            on the management of these risks on an ongoing basis throughout the implementation
            of significant projects. System Development and Acquisition
      - id: rmit-10.4
        class: standard
        title: RMIT 10.4
        props:
        - name: label
          value: '10.4'
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.4_smt
          name: statement
          prose: A financial institution must establish a framework to guide the design,
            planning, implementation, and governance of an enterprise technology architecture.
            A technology architecture serves as a foundation on which financial institutions
            plan and structure system development and acquisition strategies to meet
            business goals. Thus, the financial institution must ensure the framework
            carry out these functions- (a) provides a comprehensive view of technology
            throughout the financial institution, baseline architecture components
            and key rationale for their use; (b) is an overall technical design and
            high-level plan that describes the financial institution’s technology
            infrastructure, systems’ inter- connectivity and dependencies (e.g. fallback
            facility), and security controls. The outlined information is critical
            to support identification of a single point of failure; (c) contains mapping
            to supported business functions, organisation units, applications, and
            data to enable business impact analysis; (d) defines principles and guideline
            to govern the design and maintenance of the network infrastructure, related
            technology controls, and IT security policies; and (e) outline longer-term
            priorities to guide its evolution.
      - id: rmit-10.5
        class: standard
        title: RMIT 10.5
        props:
        - name: label
          value: '10.5'
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.5_smt
          name: statement
          prose: A financial institution must adopt a methodology for an effective
            and secure implementation of IT systems. Key phases of System Development
            Life Cycle (SDLC) shall include requirement, design, development, testing,
            deployment, change management, maintenance and decommissioning, and integrate
            with- (a) enterprise architecture to ensure successful execution of business
            strategy; (b) risk management policies and practices to achieve business
            objectives; and (c) security principles and requirements to ensure confidentiality,
            integrity, and availability of customer and counterparty information.
      - id: rmit-10.6
        class: standard
        title: RMIT 10.6
        props:
        - name: label
          value: '10.6'
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.6_smt
          name: statement
          prose: A financial institution must meet enterprise security, governance
            and compliance requirements when using rapid system development methodology
            . Given the dynamic environment can increase likelihood of errors, a financial
            institution shall automate the IT security compliance review to prevent
            unauthorised access as well as the discovery and testing of security vulnerabilities
            to ensure secure release of new IT services.
      - id: rmit-10.7
        class: standard
        title: RMIT 10.7
        props:
        - name: label
          value: '10.7'
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.7_smt
          name: statement
          prose: A financial institution shall physically segregate the production
            environment from the development and testing environment to mitigate the
            risk of unauthorised changes to the production systems. Where a financial
            institution is relying on a cloud environment, the financial institution
            shall ensure that these environments are not running on the same virtual
            host.
      - id: rmit-10.8
        class: standard
        title: RMIT 10.8
        props:
        - name: label
          value: '10.8'
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.8_smt
          name: statement
          prose: A financial institution must establish a sound methodology for a
            rigorous system testing prior to deployment. The testing shall ensure
            that the system meets user requirements and performs robustly. Where sensitive
            test data is used, the financial institution must ensure proper authorisation
            procedures and adequate measures to prevent their unauthorised disclosure
            are in place.
      - id: rmit-10.9
        class: guidance
        title: RMIT 10.9
        props:
        - name: label
          value: '10.9'
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: G
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.9_smt
          name: statement
          prose: The scope of system testing referred to in paragraph 10.8 may include
            unit testing, integration testing, user acceptance testing, application
            security testing, stress and load testing, regression, exception and negative
            testing, where applicable.
      - id: rmit-10.10
        class: standard
        title: RMIT 10.10
        props:
        - name: label
          value: '10.10'
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.10_smt
          name: statement
          prose: A financial institution must ensure any changes to the source code
            of critical systems are subject to adequate source code reviews to ensure
            code is secure and developed in line with recognised coding practices
            prior to introducing any system changes.
      - id: rmit-10.11
        class: standard
        title: RMIT 10.11
        props:
        - name: label
          value: '10.11'
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.11_smt
          name: statement
          prose: A financial institution must establish appropriate procedures to
            independently review and approve system changes. The financial institution
            must also establish and test contingency plans in the event of an unsuccessful
            implementation of material changes to minimise any business disruption.
      - id: rmit-10.12
        class: standard
        title: RMIT 10.12
        props:
        - name: label
          value: '10.12'
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.12_smt
          name: statement
          prose: 'In relation to critical systems that are developed or maintained
            by third party service provider, a financial institution must, through
            contractual obligations, require third party service provider to: (a)
            provide sufficient notice to the financial institution before any changes
            are undertaken that may impact the IT system; (b) demonstrate that it
            adopts secure by design principles in IT system development methodology
            to mitigate cyber risks from propagating across the supply chain; and
            (c) ensure the source code continues to be readily accessible for business
            continuity.'
      - id: rmit-10.13
        class: standard
        title: RMIT 10.13
        props:
        - name: label
          value: '10.13'
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.13_smt
          name: statement
          prose: When decommissioning critical systems, a financial institution must
            ensure minimal adverse impact on customers and business operations. This
            includes establishing and testing contingency plans in the event of unsuccessful
            system decommissioning.
      - id: rmit-10.14
        class: guidance
        title: RMIT 10.14
        props:
        - name: label
          value: '10.14'
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: G
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.14_smt
          name: statement
          prose: A financial institution may deploy automated tools for software development,
            testing, software deployment, change management, code scanning and software
            version control to facilitate timely security assessment of critical systems
            in keeping with growing complexity in IT systems and emerging cyber threats.
      - id: rmit-10.15
        class: guidance
        title: RMIT 10.15
        props:
        - name: label
          value: '10.15'
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: G
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.15_smt
          name: statement
          prose: Where a third party software is used, a financial institution should
            consider the potential risks and impacts a cyber supply chain incident
            may pose to its overall business operations and services. A financial
            institution may consider- (a) adopting Software-Bill-of-Materials (SBOM)
            to automate the identification and continuous monitoring of potential
            security vulnerabilities including security issues associated with third
            party software components; and (b) establishing open-source software security
            policy and procedures. This includes ensuring secure access to source
            code repositories in third party platforms, regular monitoring to prevent
            data leakages, adoption of secure coding practices, robust testing of
            open-source software and timely vulnerability assessment to mitigate security
            vulnerabilities and propagation of malwares across supply chain.
      - id: rmit-10.16
        class: standard
        title: RMIT 10.16
        props:
        - name: label
          value: '10.16'
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.16_smt
          name: statement
          prose: A financial institution must develop and implement robust policies
            to identify and reduce shadow IT risks. Patch and End-of-Life System Management
      - id: rmit-10.17
        class: standard
        title: RMIT 10.17
        props:
        - name: label
          value: '10.17'
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.17_smt
          name: statement
          prose: A financial institution must ensure that all systems including digital
            services are not running with known security vulnerabilities , on outdated
            platform or end-of-life (EOL) technology systems. In this regard, a financial
            institution must- (a) maintain current security baseline for the security
            hardening of technology components and ensure the security baseline is
            accurate and up to date; (b) continuously monitor and implement latest
            patch releases in a timely manner; (c) identify, plan and implement remedial
            action for technology systems that are approaching EOL; and (d) obtain
            management approval for any exception permitting the continued use of
            unsupported or outdated technology. This exception must be substantiated
            by a thorough risk assessment with clear timeline for phasing out the
            outdated technology and are regularly reviewed at least on annual basis
            to ensure associated risks are effectively managed.
      - id: rmit-10.18
        class: standard
        title: RMIT 10.18
        props:
        - name: label
          value: '10.18'
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.18_smt
          name: statement
          prose: 'A financial institution must establish a patch and EOL management
            framework which addresses among others the following requirements: (a)
            identification and risk assessment of all technology assets for potential
            vulnerabilities arising from undeployed patches or EOL systems; (b) formulation
            of criteria, priority and turnaround time for patch deployment according
            to the severity of the vulnerabilities identified; (c) conduct of compatibility
            testing prior to the deployment of patches to minimise disruption to connected
            systems; (d) adherence to the workflow for end-to-end patch deployment
            processes including approval, testing, monitoring and tracking of activities;
            and (e) end-user awareness for orderly transition.'
      - id: rmit-10.19
        class: standard
        title: RMIT 10.19
        props:
        - name: label
          value: '10.19'
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.19_smt
          name: statement
          prose: A financial institution must continually monitor the effectiveness
            and security of the technology in use, incorporating developments in technology
            that may disrupt existing security controls . A financial institution
            shall- (a) ensure its board receives advice on the potential impact to
            business operation arising from evolving technology landscape; (b) formulate
            long-term strategy to address anticipated changes with allocation of competent
            resources to manage associated risks, including new cyber adversary tactics
            and techniques; and (c) establish roadmap for system migration to preserve
            security and reliability of the technology infrastructure in an orderly
            manner. Cryptography
      - id: rmit-10.20
        class: standard
        title: RMIT 10.20
        props:
        - name: label
          value: '10.20'
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.20_smt
          name: statement
          prose: A financial institution must establish a robust and resilient cryptography
            policy to promote the adoption of strong cryptographic controls for protection
            of important data and information. This policy, at a minimum, shall address
            requirements for- (a) the adoption of industry standards for encryption
            algorithms, message authentication, hash functions, digital signatures
            and random number generation; (b) the adoption of robust and secure processes
            in managing cryptographic key lifecycles which include generation, distribution,
            renewal, usage, storage, recovery, revocation and destruction; (c) the
            periodic review, at least annually, of all cryptographic standards and
            algorithms currently in use for critical systems, external linked or transactional
            customer-facing applications to prevent exploitation of weakened algorithms
            or protocols; (d) the expansion of IT asset inventory to include all cryptographic
            tools and algorithms in use with pertinent information on the rationale
            for each cryptographic method employed and its mapping to supported application
            systems; and (e) the development and testing of compromise-recovery plans
            in the event of a cryptographic key compromise. This must set out the
            escalation process, procedures for keys regeneration, interim measures,
            changes to business-as-usual protocols and containment strategies or options
            to minimise the impact of a compromise.
      - id: rmit-10.21
        class: standard
        title: RMIT 10.21
        props:
        - name: label
          value: '10.21'
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.21_smt
          name: statement
          prose: 'A financial institution must conduct due diligence and evaluate
            the cryptographic controls associated with the technology used in order
            to protect the confidentiality, integrity, authentication, authorisation
            and non-repudiation of information. Additionally, a financial institution
            must ensure the following: (a) except for non-critical systems or applications
            that do not contain customer information, the financial institution must
            retain ownership and control of the encryption keys (themselves or with
            an independent key custodian) to minimize the risk of unauthorised access
            to the data; (b) where the financial institution does not generate its
            own encryption keys, the financial institution shall undertake appropriate
            measures to ensure robust controls and processes are in place to manage
            encryption keys securely including adhere to relevant industry standard;
            (c) where this involves a reliance on third party assessments , the financial
            institution shall consider whether such reliance is consistent with the
            financial institution’s risk appetite and tolerance; and (d) the financial
            institution must also give due regard to the system resources required
            to support the cryptographic controls and the risk of reduced network
            traffic visibility of data that has been encrypted.'
      - id: rmit-10.22
        class: standard
        title: RMIT 10.22
        props:
        - name: label
          value: '10.22'
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.22_smt
          name: statement
          prose: A financial institution must ensure cryptographic controls are based
            on the effective implementation of suitable cryptographic protocols. The
            protocols shall include secret and public cryptographic key protocols,
            both of which shall reflect a high degree of protection to the applicable
            secret or private cryptographic keys. The selection of such protocols
            must be based on recognised international standards and tested accordingly.
            Commensurate with the level of risk, secret cryptographic key and private-cryptographic
            key storage and encryption / decryption computation must be undertaken
            in a protected environment, supported by a hardware security module (HSM),
            trusted execution environment (TEE) or similarly secured devices.
      - id: rmit-10.23
        class: standard
        title: RMIT 10.23
        props:
        - name: label
          value: '10.23'
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.23_smt
          name: statement
          prose: A financial institution shall store public cryptographic keys in
            a certificate issued by a Certificate Authority, as appropriate to the
            level of risk. Such certificates associated with customers shall be issued
            by recognised Certificate Authorities. The financial institution must
            ensure that the implementation of authentication and signature protocols
            using such certificates are subject to strong protection to ensure that
            the use of private cryptographic keys corresponding to the user certificates
            are legally binding and irrefutable. The initial issuance and subsequent
            renewal of such certificates must be consistent with industry best practices
            and applicable legal / regulatory specifications. Data Centre Resilience
      - id: rmit-10.24
        class: standard
        title: RMIT 10.24
        props:
        - name: label
          value: '10.24'
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.24_smt
          name: statement
          prose: A financial institution must specify the resilience and availability
            objectives of its data centres to effectively support its business recovery
            objectives.
      - id: rmit-10.25
        class: standard
        title: RMIT 10.25
        props:
        - name: label
          value: '10.25'
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.25_smt
          name: statement
          prose: A financial institution must ensure data centres have redundant capacity
            components and multiple distribution paths serving the computer equipment
            to eliminate any single point of failure for effective achievement of
            the identified business recovery objectives.
      - id: rmit-10.26
        class: standard
        title: RMIT 10.26
        props:
        - name: label
          value: '10.26'
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.26_smt
          name: statement
          prose: A financial institution shall host critical systems in a dedicated
            space intended for production data centre usage. The dedicated space must
            be physically secured from unauthorised access and is not located in a
            disaster-prone area. A financial institution must also ensure there is
            no single point of failure in the design and connectivity for critical
            components of the production data centres, including hardware components,
            electrical utility, thermal management and data centre infrastructure.
            A financial institution must also ensure adequate maintenance, and holistic
            and continuous monitoring of these critical components with timely alerts
            on faults and indicators of potential issues.
      - id: rmit-10.27
        class: standard
        title: RMIT 10.27
        props:
        - name: label
          value: '10.27'
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.27_smt
          name: statement
          prose: A financial institution must establish adequate control procedures
            for its data centre operations, including the deployment of relevant automated
            tools for batch processing management to ensure timely and accurate batch
            processes. These control procedures shall also include procedures for
            implementing changes in the production system, error handling as well
            as management of other exceptional conditions.
      - id: rmit-10.28
        class: standard
        title: RMIT 10.28
        props:
        - name: label
          value: '10.28'
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.28_smt
          name: statement
          prose: A financial institution must segregate incompatible activities in
            the data centre operations environment to prevent any unauthorised activity
            . In the case where vendors’ or programmers’ access to the production
            environment is necessary, these activities must be properly authorised
            and monitored. Service Availability
      - id: rmit-10.29
        class: standard
        title: RMIT 10.29
        props:
        - name: label
          value: '10.29'
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.29_smt
          name: statement
          prose: A financial institution must ensure its system capacity needs are
            well- planned and managed with due regard to peak processing period, business
            growth plans and technology architecture changes.
      - id: rmit-10.30
        class: standard
        title: RMIT 10.30
        props:
        - name: label
          value: '10.30'
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.30_smt
          name: statement
          prose: A financial institution must establish real-time monitoring mechanisms
            to track capacity utilisation and performance of key processes and services
            . These monitoring mechanisms shall be capable of providing actionable
            alerts to administrators to enable timely detection and resolution of
            service interruptions. The monitoring scope, metrics and thresholds shall
            be updated periodically to ensure they remain effective.
      - id: rmit-10.31
        class: standard
        title: RMIT 10.31
        props:
        - name: label
          value: '10.31'
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.31_smt
          name: statement
          prose: 'A financial institution shall enhance the resilience of key digital
            services and delivery channels through the following measures: (a) implement
            effective mechanisms by 30 September 2027 to provide early signals or
            warning of service degradation or intermittent failures. This means the
            capability to: (i) detect failed transactions and measure service availability
            more accurately; (ii) monitor the number of affected customers and transaction
            volumes during service disruptions to measure the extent and severity
            customer impact; and (iii) immediately escalating to senior management
            when service disruptions affect 5% or more of expected daily customers
            or transaction volumes; (b) conduct regular reviews to identify and mitigate
            potentially vulnerable IT system interdependencies to prevent simultaneous
            interruptions to multiple digital services or delivery channels; and (c)
            establish stand-in processing arrangement by 30 September 2027 and deploy
            such arrangement during disruptions to ensure continuity of services during
            disruptions. A financial institution shall prioritise deployment of this
            capability for digital services and delivery channels which are least
            substitutable , and ensure its customers are well informed on the terms
            of use (such as the transaction limit), associated risks and allocation
            of responsibilities between parties and mitigation actions against fraud
            risks.'
      - id: rmit-10.32
        class: standard
        title: RMIT 10.32
        props:
        - name: label
          value: '10.32'
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.32_smt
          name: statement
          prose: For critical systems, where there is a reasonable expectation for
            immediate delivery of service to customers or dealings with counterparties,
            a financial institution must ensure that these systems are designed for
            high availability with a cumulative unplanned downtime affecting the interface
            with customers or counterparties of not more than 4 hours on a rolling
            12 months basis and a maximum tolerable downtime of 120 minutes per incident.
      - id: rmit-10.33
        class: guidance
        title: RMIT 10.33
        props:
        - name: label
          value: '10.33'
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: G
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.33_smt
          name: statement
          prose: Eligible e-money issuers, non-bank registered merchant acquirers
            and intermediary remittance institutions that have not been designated
            as a National Critical Information Infrastructure (NCII) entity are encouraged
            to implement the measures provided in paragraph 10.31.
      - id: rmit-10.34
        class: standard
        title: RMIT 10.34
        props:
        - name: label
          value: '10.34'
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.34_smt
          name: statement
          prose: A financial institution shall prioritise diversity in technology
            to enhance resilience by ensuring critical systems infrastructure are
            not excessively exposed to similar technology risks.
      - id: rmit-10.35
        class: standard
        title: RMIT 10.35
        props:
        - name: label
          value: '10.35'
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.35_smt
          name: statement
          prose: During an interruption of digital services or delivery channels,
            including periods of performance degradation or intermittent failures,
            a financial institution shall respond promptly and effectively to minimise
            the impact on its customers. This includes but not limited to- (a) ensure
            timely escalation and decision-making to resume services promptly via
            alternative arrangements and stabilise performance within the timeframe
            specified in paragraph 10.32 under all plausible scenarios; (b) define
            clear accountabilities for managing performance degradation issues and
            formalise arrangements with third party service providers to ensure effective
            coordination and timely recovery to normal performance levels; (c) establish
            a communication plan for service interruptions to immediately inform affected
            customers, properly manage a high volume of customer feedback, and provide
            frequent updates on recovery efforts, as well as actionable information
            on available alternatives for customers with urgent needs; (d) provide
            customers with a convenient means of checking the availability of digital
            services, which may include publishing real- time availability and performance
            status of its digital services on the corporate website; and (e) disclose
            the track record of service availability on a quarterly basis within 15
            calendar days of quarter-end, beginning from 15 October 2027. Network
            Resilience
      - id: rmit-10.36
        class: standard
        title: RMIT 10.36
        props:
        - name: label
          value: '10.36'
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.36_smt
          name: statement
          prose: A financial institution must design and implement a reliable, scalable
            and secure enterprise network that is able to support its business activities,
            including future growth plans.
      - id: rmit-10.37
        class: standard
        title: RMIT 10.37
        props:
        - name: label
          value: '10.37'
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.37_smt
          name: statement
          prose: A financial institution must ensure the network services for its
            critical systems are reliable and have no single point of failure in order
            to protect the critical systems against potential network faults and cyber
            threats.
      - id: rmit-10.38
        class: guidance
        title: RMIT 10.38
        props:
        - name: label
          value: '10.38'
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: G
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.38_smt
          name: statement
          prose: The control measures to prevent from network faults as referred to
            in paragraph 10.37 are expected to include component redundancy, service
            diversity and alternate network paths.
      - id: rmit-10.39
        class: standard
        title: RMIT 10.39
        props:
        - name: label
          value: '10.39'
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.39_smt
          name: statement
          prose: A financial institution must establish real-time network bandwidth
            monitoring processes and corresponding network service resilience metrics
            to flag any over utilisation of bandwidth and system disruptions due to
            bandwidth congestion and network faults. This includes traffic analysis
            to detect trends and anomalies.
      - id: rmit-10.40
        class: standard
        title: RMIT 10.40
        props:
        - name: label
          value: '10.40'
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.40_smt
          name: statement
          prose: A financial institution must ensure network services supporting critical
            systems are designed and implemented to ensure the confidentiality, integrity
            and availability of data.
      - id: rmit-10.41
        class: standard
        title: RMIT 10.41
        props:
        - name: label
          value: '10.41'
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.41_smt
          name: statement
          prose: A financial institution must establish and maintain a network design
            blueprint identifying all of its internal and external network interfaces
            and connectivity. The blueprint must highlight both physical and logical
            connectivity between network components and network segmentations.
      - id: rmit-10.42
        class: standard
        title: RMIT 10.42
        props:
        - name: label
          value: '10.42'
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.42_smt
          name: statement
          prose: A financial institution must ensure sufficient and relevant network
            device logs are retained for investigations and forensic purposes for
            at least three years.
      - id: rmit-10.43
        class: standard
        title: RMIT 10.43
        props:
        - name: label
          value: '10.43'
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.43_smt
          name: statement
          prose: A financial institution must implement appropriate safeguards to
            minimise the risk of a system compromise in one entity affecting other
            entities within the group. Safeguards implemented may include establishing
            logical network segmentation for the financial institution from other
            entities within the group. System backup and restoration
      - id: rmit-10.44
        class: standard
        title: RMIT 10.44
        props:
        - name: label
          value: '10.44'
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.44_smt
          name: statement
          prose: A financial institution must establish a robust backup strategy and
            procedures to meet business recovery objectives. At a minimum, a financial
            institution shall- (a) establish backup and restoration procedures to
            effectively manage the backup data life cycle; (b) maintain an adequate
            number of backup copies of all critical data, the updated version of the
            operating system software, production programs, system utilities, all
            master and transaction files and event logs for recovery purposes; (c)
            backup media must be stored in an environmentally secure and access-controlled
            backup site; (d) secure the storage and transportation of sensitive data
            in removable media to meet minimum controls as specified in Appendix 1
            or equivalent; (e) test backup and restoration procedures periodically
            to validate recovery capabilities. Remedial actions shall be taken promptly
            by the financial institution to fix the root cause of unsuccessful backups;
            and (f) undertake an independent risk assessment of its end-to-end backup
            storage and delivery management to ensure that existing controls are adequate
            in protecting sensitive data at all times.
      - id: rmit-10.45
        class: standard
        title: RMIT 10.45
        props:
        - name: label
          value: '10.45'
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.45_smt
          name: statement
          prose: A financial institution shall establish a tamper-proof backup arrangement
            and an isolated recovery environment to enable timely resumption of critical
            banking and payment services within its tolerable level in the event of
            destructive cyber-attacks such as widespread data loss caused by ransomware.
            Third Party Service Provider Management
      - id: rmit-10.46
        class: standard
        title: RMIT 10.46
        props:
        - name: label
          value: '10.46'
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.46_smt
          name: statement
          prose: The board and senior management of the financial institution must
            exercise effective oversight and address associated risks when engaging
            third party service providers for critical technology functions and systems.
            The financial institution remains accountable for managing all risks that
            arise from engagement of third party service providers, to ensure security
            and reliability of technology services in compliance with all relevant
            regulatory requirements prescribed in this policy document.
      - id: rmit-10.47
        class: standard
        title: RMIT 10.47
        props:
        - name: label
          value: '10.47'
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.47_smt
          name: statement
          prose: A financial institution must conduct a due diligence on a third party
            service provider prior its on-boarding or engagement and throughout the
            service engagement to ensure achievement of business performance and recovery
            objectives remain unimpaired, considering the latest risk environment.
            At the minimum, a financial institution must consider the range of risks
            outlined in Appendix 8.
      - id: rmit-10.48
        class: standard
        title: RMIT 10.48
        props:
        - name: label
          value: '10.48'
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.48_smt
          name: statement
          prose: 'A financial institution must establish a Service Level Agreement
            (SLA) when engaging third party service provider. At a minimum, the SLA
            shall contain the following: (a) access rights for the regulator and any
            party appointed by the financial institution to examine any activity or
            entity of the financial institution. This shall include access to any
            record, file or data of the financial institution, including management
            information and the minutes of all consultative and decision-making processes;
            (b) requirements for the third party service provider to provide sufficient
            prior notice to financial institutions of any sub-contracting which is
            substantial; (c) a written undertaking by the third party service provider
            on its compliance with secrecy provisions under relevant legislations.
            The SLA shall further clearly provide for the third party service provider
            to be bound by integrity and confidentiality provisions stipulated under
            the contract even after the engagement has ended; (d) arrangements for
            disaster recovery and backup capability, where applicable; (e) service
            level objectives for uptime or availability; (f) arrangements to secure
            business continuity in the event of an exit or termination of the third
            party service provider, which includes ensuring data residing in third
            party service providers are recoverable in a timely manner; (g) responsibility
            of third party service providers to promptly disclose and notify the financial
            institution of any service disruptions or cyber incidents that affect
            the financial institution or its customer data that occur within such
            service providers'' or sub-contractors’ environment. (h) requirements
            for the third party service providers to comply with the relevant internationally
            recognised standards and ensure their key staff keep their skills up-to-date
            with the relevant certifications; and (i) requirements for third party
            service providers to participate in the financial institution’s security
            awareness and education program, where appropriate.'
      - id: rmit-10.49
        class: standard
        title: RMIT 10.49
        props:
        - name: label
          value: '10.49'
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.49_smt
          name: statement
          prose: 'A financial institution must formulate a roadmap to achieve continuous
            monitoring of a third party service provider’s cybersecurity posture to
            obtain real-time insights for effective incident management. The financial
            institution shall undertake the following: (a) measure the IT infrastructure
            footprint and the customer information accessible to third parties, and
            regularly manage this external stress state exposures to mitigate cyber-attack
            surfaces; (b) adopt leading security policies and controls to mitigate
            product- specific third party risks; (c) ensure incident response plans
            incorporate protocols with third party service providers to detect and
            contain adverse impact of security vulnerabilities resulting from software
            updates; (d) define a priority set of security controls that require more
            frequent assurance assertion from the third party service providers; (e)
            monitor technology and cyber incidents information disclosed by third
            party service providers at a higher frequency; (f) implement technology
            solutions to automate metric testing; and (g) establish processes to respond
            to breached thresholds, including investigating failed assertions and
            remedying control gaps. Cloud Services'
      - id: rmit-10.50
        class: standard
        title: RMIT 10.50
        props:
        - name: label
          value: '10.50'
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.50_smt
          name: statement
          prose: 'A financial institution must fully understand the inherent risk
            of adopting cloud services. In this regard, a financial institution shall
            conduct a comprehensive risk assessment prior to cloud adoption which
            considers the inherent architecture of cloud services that leverages on
            the sharing of resources and services across multiple tenants over the
            Internet. The assessment must specifically address risks associated with
            the following: (a) sophistication of the deployment model; (b) migration
            of existing systems to cloud infrastructure; (c) location of cloud infrastructure
            including potential geo-political risks and legal risks that may impede
            compliance with any legal or regulatory requirements; (d) multi-tenancy
            or data co-mingling; (e) vendor lock-in and application portability or
            interoperability; (f) ability to customise security configurations of
            the cloud infrastructure to ensure a high level of data and technology
            system protection; (g) exposure to cyber-attacks via cloud service providers;
            (h) termination of a cloud service provider including the ability to secure
            the financial institution’s data following the termination; (i) demarcation
            of responsibilities, limitations and liability of the cloud service provider;
            and (j) ability to meet regulatory requirements and international standards
            on cloud computing on a continuing basis.'
      - id: rmit-10.51
        class: guidance
        title: RMIT 10.51
        props:
        - name: label
          value: '10.51'
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: G
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.51_smt
          name: statement
          prose: For critical systems hosted on a public cloud , a financial institution
            is expected to consider common key risks and control measures as specified
            in Appendix 10. A financial institution that relies on alternative risk
            management practices that depart from the measures outlined in Appendix
            10 is expected to be prepared to explain and demonstrate to the Bank that
            these alternative practices are at least as effective as, or superior
            to, the measures in Appendix 10.
      - id: rmit-10.52
        class: standard
        title: RMIT 10.52
        props:
        - name: label
          value: '10.52'
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.52_smt
          name: statement
          prose: A financial institution must implement appropriate safeguards on
            customer and counterparty information and proprietary data when using
            cloud services to protect against unauthorised disclosure and access.
            This shall include retaining ownership, control and management of all
            data pertaining to customer and counterparty information, proprietary
            data and services hosted on the cloud, including the relevant cryptographic
            keys management. Access Control
      - id: rmit-10.53
        class: standard
        title: RMIT 10.53
        props:
        - name: label
          value: '10.53'
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.53_smt
          name: statement
          prose: A financial institution must implement an access control policy for
            the identification, authentication, and authorisation of all users to
            its IT assets and data. The level of granularity defined in the access
            control policy shall be commensurate with the level of risk of unauthorised
            access to its IT assets.
      - id: rmit-10.54
        class: standard
        title: RMIT 10.54
        props:
        - name: label
          value: '10.54'
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.54_smt
          name: statement
          prose: 'A financial institution shall adhere to the following principles:
            (a) adopt a “deny all” access control policy for users by default because
            all access to IT assets must be explicitly authorised; (b) employ “least
            privilege” access rights to ensure IT assets are accessed on a “need-to-have”
            basis where only the minimum sufficient permissions are granted to legitimate
            users to perform their roles; (c) employ time-bound access which restrict
            access to a specific period based on the nature of work; (d) employ segregation
            of incompatible functions where no single person is responsible for an
            entire operation that may provide the ability to independently modify,
            circumvent, and disable system security features. This may include a combination
            of functions such as: (i) system development and technology operations;
            (ii) security administration and system administration; (iii) network
            operation and network security; and (iv) IT operations environment; (e)
            establish criteria for activities that require dual authorization control;
            and (f) adopt robust user authorization and authentication based on criticality
            of IT assets as follows: (i) stronger authentication for critical activities
            and higher-risk environment such as remote access; (ii) ensure user credentials
            provisioned with robust identity verification method to prevent impersonation
            risks; and (iii) ensure online credential is uniquely linked to a single
            user to ensure clear accountability in access to confidential IT assets.'
      - id: rmit-10.55
        class: standard
        title: RMIT 10.55
        props:
        - name: label
          value: '10.55'
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.55_smt
          name: statement
          prose: A financial institution must employ a multi-factor authentication
            (MFA) that can defend against social engineering attacks for authenticating
            user access to critical systems. The MFA must combine two or more of knowledge
            factors, inherent factors (e.g. biometric characteristics) or possession
            factors (e.g. security keys, tokens).
      - id: rmit-10.56
        class: standard
        title: RMIT 10.56
        props:
        - name: label
          value: '10.56'
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.56_smt
          name: statement
          prose: A financial institution must establish a user access matrix to outline
            access rights, user roles or profiles, and the authorising and approving
            authorities. The access matrix must be periodically reviewed and updated.
      - id: rmit-10.57
        class: standard
        title: RMIT 10.57
        props:
        - name: label
          value: '10.57'
        - name: source-page
          value: '27'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-10.57_smt
          name: statement
          prose: A financial institution must ensure- (a) access controls to enterprise-wide
            systems are effectively managed and monitored; (b) anomalies are flagged
            for prompt investigations to contain any cyber incidents; and (c) user
            activities in critical systems are logged for audit and investigations.
            Activity logs must be maintained for at least three years and regularly
            reviewed in a timely manner.
    - id: rmit-g-11
      class: rmit-section
      title: Cybersecurity Management
      props:
      - name: label
        value: '11'
      controls:
      - id: rmit-11.1
        class: standard
        title: RMIT 11.1
        props:
        - name: label
          value: '11.1'
        - name: source-page
          value: '28'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.1_smt
          name: statement
          prose: A financial institution must ensure that there is an enterprise-wide
            focus on effective cyber risk management to reflect the collective responsibility
            of business and technology lines for managing cyber risks.
      - id: rmit-11.2
        class: standard
        title: RMIT 11.2
        props:
        - name: label
          value: '11.2'
        - name: source-page
          value: '28'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.2_smt
          name: statement
          prose: A financial institution must develop a CRF which clearly articulates
            its governance for managing cyber risks, its cyber resilience objectives
            and its risk tolerance, with due regard to the evolving cyber threat environment.
            Objectives of the CRF shall include ensuring operational resilience against
            extreme but plausible cyber-attacks. The framework must be able to support
            the effective identification, protection, detection, response, and recovery
            (IPDRR) of systems and data hosted on- premises or by third party service
            providers from internal and external cyber-attacks.
      - id: rmit-11.3
        class: standard
        title: RMIT 11.3
        props:
        - name: label
          value: '11.3'
        - name: source-page
          value: '28'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.3_smt
          name: statement
          prose: 'The CRF must consist of, at a minimum, the following elements: (a)
            development of an institutional understanding of the overall cyber risk
            context in relation to the financial institution’s business and operations,
            its exposure to cyber risks and current cybersecurity posture; (b) identification,
            classification and prioritisation of critical systems, information, assets
            and interconnectivity (with internal and external parties) to obtain a
            complete and accurate view of the financial institution’s information
            assets, critical systems, interdependencies and cyber risk profile; (c)
            identification of cybersecurity threats, vulnerabilities and countermeasures
            to secure digital services delivery against cyber- attacks and contain
            reputational damage that can undermine confidence in the financial institution;
            (d) enhancing layers of cyber defence with reference to the latest international
            standards and sound practices such as zero-trust principles , defense-in-depth
            through micro-segmentation and security by design, to protect its data,
            infrastructure and assets against evolving cyber threats; (e) timely detection
            of cybersecurity incidents through continuous surveillance and monitoring;
            (f) detailed incident handling policies and procedures and a crisis response
            management playbook to support the swift recovery from cyber incidents
            and contain any damage resulting from a cybersecurity breach; (g) policies
            and procedures for timely and secure information sharing and collaboration
            with other financial institutions and participants in financial market
            infrastructure to strengthen cyber resilience and fraud prevention; (h)
            implement a centralised automated tracking system to manage its technology
            asset inventory; and (i) establish a cyber risk management function to
            analyse actual and potential cyber threats, providing risk assessments
            and timely escalation of high-risk cyber threats to senior management
            and the board. This function shall be performed by an in-house dedicated
            team or by leveraging on the parent or group.'
      - id: rmit-11.4
        class: standard
        title: RMIT 11.4
        props:
        - name: label
          value: '11.4'
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.4_smt
          name: statement
          prose: A financial institution that is designated as a National Critical
            Information Infrastructure (NCII) entity pursuant to the Cyber Security
            Act 2024 must ensure compliance to the requirements and guidelines applicable
            to NCII, including any additional directives and standards issued by the
            National Cyber Security Agency (NACSA).
      - id: rmit-11.5
        class: standard
        title: RMIT 11.5
        props:
        - name: label
          value: '11.5'
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.5_smt
          name: statement
          prose: A financial institution must adopt robust control measures as outlined
            in Appendix 5 to enhance its resilience to cyber-attacks.
      - id: rmit-11.6
        class: standard
        title: RMIT 11.6
        props:
        - name: label
          value: '11.6'
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.6_smt
          name: statement
          prose: A financial institution must conduct a realistic "Red Team " simulation
            attack on its infrastructure at least once every three years to proactively
            identify and manage potential vulnerabilities.
      - id: rmit-11.7
        class: guidance
        title: RMIT 11.7
        props:
        - name: label
          value: '11.7'
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: G
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.7_smt
          name: statement
          prose: A financial institution may implement crowdsourced security testing
            programs as a complement to existing security assessments, in order to
            thoroughly test the security of their IT environment. The financial institution
            must engage reputable and credible service providers to facilitate the
            program. Cybersecurity Operations
      - id: rmit-11.8
        class: standard
        title: RMIT 11.8
        props:
        - name: label
          value: '11.8'
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.8_smt
          name: statement
          prose: 'A financial institution must establish clear responsibilities for
            cybersecurity operations which shall include implementing appropriate
            mitigating measures in the financial institution’s conduct of business
            that correspond to the following phases of the cyber-attack lifecycle:
            (a) reconnaissance; (b) weaponisation; (c) delivery; (d) exploitation;
            (e) installation; (f) command and control; and (g) exfiltration.'
      - id: rmit-11.9
        class: standard
        title: RMIT 11.9
        props:
        - name: label
          value: '11.9'
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.9_smt
          name: statement
          prose: A financial institution must ensure continuous and proactive monitoring
            and timely detection of anomalous activities in its technology infrastructure
            to prevent potential compromise of its security controls or weakening
            of its security posture. This shall include- (a) establishing a Security
            Operations Center (SOC) supported by competent resources and equipped
            with the necessary tools and technologies for proactive monitoring of
            its technology security posture; (b) ensuring the scope of monitoring
            must cover all critical systems including the supporting infrastructure;
            and (c) conducting regular review of its security posture via the conduct
            of a vulnerability assessment and penetration testing in line with Appendix
            5.
      - id: rmit-11.10
        class: standard
        title: RMIT 11.10
        props:
        - name: label
          value: '11.10'
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.10_smt
          name: statement
          prose: A financial institution must establish a process to collect, analyse
            and evaluate cyber threat information in relation to its environment (“cyber
            threat intelligence”) to promptly detect cyber threats, including data
            breach incidents and spread of misleading information in relation to the
            financial institution over the Internet .
      - id: rmit-11.11
        class: standard
        title: RMIT 11.11
        props:
        - name: label
          value: '11.11'
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.11_smt
          name: statement
          prose: A financial institution must establish appropriate response to investigate
            and respond to flagged anomalous activities based on their level of complexity.
            Cyber Response and Recovery
      - id: rmit-11.12
        class: standard
        title: RMIT 11.12
        props:
        - name: label
          value: '11.12'
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.12_smt
          name: statement
          prose: A financial institution must establish comprehensive cyber crisis
            management policies and procedures that incorporate cyber-attack scenarios
            and responses in the organisation’s overall crisis management plan, escalation
            processes, business continuity and disaster recovery planning. This includes
            developing a clear communication plan for engaging shareholders, regulatory
            authorities, customers and employees in the event of a cyber incident.
      - id: rmit-11.13
        class: standard
        title: RMIT 11.13
        props:
        - name: label
          value: '11.13'
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.13_smt
          name: statement
          prose: 'A financial institution must establish and implement a comprehensive
            Cyber Incident Response Plan (CIRP). The CIRP must address the following:
            (a) Preparedness Establish a clear governance process, reporting structure
            and roles and responsibilities of the Cyber Emergency Response Team (CERT)
            as well as invocation and escalation procedures in the event of an incident;
            (b) Detection and analysis Ensure effective and expedient processes for
            identifying points of compromise, assessing the extent of damage and preserving
            sufficient evidence for forensics purposes; (c) Containment and eradication
            Identify and implement remedial actions to prevent or minimise damage
            to the financial institution, contain and remove the known threats and
            resume business activities; (d) Recovery Implement multiple strategies
            including contingency plans as part of incident recovery to swiftly resume
            business operations and significantly enhance redundancy and resilience;
            and (e) Post-incident activity Conduct post-incident review incorporating
            lessons learned and develop long-term risk mitigations.'
      - id: rmit-11.14
        class: standard
        title: RMIT 11.14
        props:
        - name: label
          value: '11.14'
        - name: source-page
          value: '31'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.14_smt
          name: statement
          prose: A financial institution must ensure that relevant CERT members are
            conversant with the incident response plan and handling procedures and
            remain contactable at all times.
      - id: rmit-11.15
        class: standard
        title: RMIT 11.15
        props:
        - name: label
          value: '11.15'
        - name: source-page
          value: '31'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.15_smt
          name: statement
          prose: A financial institution shall establish a secure and reliable out-of-band
            communication infrastructure for both internal and external stakeholders
            to ensure continued coordination and communication if the primary communication
            infrastructure is compromised or rendered unavailable during a crisis.
      - id: rmit-11.16
        class: standard
        title: RMIT 11.16
        props:
        - name: label
          value: '11.16'
        - name: source-page
          value: '31'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.16_smt
          name: statement
          prose: A financial institution must conduct an annual cyber drill exercise
            to test the effectiveness of its CIRP including the out-of-band communication
            methods, based on various current and emerging threat scenarios (e.g.
            social engineering), with the involvement of key stakeholders including
            members of the board, senior management and relevant third party service
            providers. The result of the annual cyber drill exercise must be reported
            to the board in a timely manner. The out-of-band communication methods
            must also be tested regularly as part of the institutions cyber drill
            exercises. The test scenarios must include scenarios designed to test-
            (a) the effectiveness of escalation, internal and external communication
            and decision-making processes that correspond to different impact levels
            of a cyber incident; and (b) the readiness and effectiveness of CERT and
            relevant third party service providers in supporting the recovery process.
      - id: rmit-11.17
        class: standard
        title: RMIT 11.17
        props:
        - name: label
          value: '11.17'
        - name: source-page
          value: '31'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.17_smt
          name: statement
          prose: A financial institution shall review its loss provision arrangements
            to ensure its adequacy to cover cyber incidents based on its scenario
            analysis of extreme adverse events. Where cyber insurance is adopted to
            mitigate impact of cyber incidents, the financial institution shall- (a)
            ensure that the scope of the insurance policy adequately covers the information
            security events and types of liability that the financial institution
            is exposed to; (b) understand the terms and conditions of the insurance
            policy in relation to warranties, attestations or any responsibilities
            of the financial institution, have them reflected in the crisis response
            policies and procedures as appropriate and ensure that any changes to
            IT services and control measures do not result in unintended exclusions
            of cover; and (c) ensure that any obligations imposed by the insurance
            policy (such as in relation to appointment of experts and accepting their
            recommendations during a cyber incident) do not impair its ability to
            act in the best interest of the financial institution and its customers.
            The financial institution shall anticipate and adequately manage any conflict
            of interest that may arise from the objective of the insurer to minimise
            the cost of its liability under the insurance policy. Cyber Reporting
            and Threat Information Sharing
      - id: rmit-11.18
        class: standard
        title: RMIT 11.18
        props:
        - name: label
          value: '11.18'
        - name: source-page
          value: '32'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.18_smt
          name: statement
          prose: A financial institution is required to notify the Bank of cyber incidents
            in adherence to the Bank’s policy documents on Operational Risk Reporting
            – Part C, Business Continuity Management – Part C, Merchant Acquiring
            Services – paragraphs 19.25 to 19.26 and any other relevant policy documents
            specified by the Bank.
      - id: rmit-11.19
        class: standard
        title: RMIT 11.19
        props:
        - name: label
          value: '11.19'
        - name: source-page
          value: '32'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.19_smt
          name: statement
          prose: Subject to the applicable data protection laws, a financial institution
            must share cyber threat intelligence information with the industry on
            a timely basis via the relevant sharing platforms developed by the Bank,
            the industry, or law enforcement agencies. In addition, the financial
            institution must allocate resources to participate in any industry-wide
            initiatives aimed at improving collective threat intelligence capabilities.
      - id: rmit-11.20
        class: standard
        title: RMIT 11.20
        props:
        - name: label
          value: '11.20'
        - name: source-page
          value: '32'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-11.20_smt
          name: statement
          prose: A financial institution shall collaborate and cooperate closely with
            relevant stakeholders and authorities in combating cyber threats.
    - id: rmit-g-12
      class: rmit-section
      title: Digital Services
      props:
      - name: label
        value: '12'
      controls:
      - id: rmit-12.1
        class: standard
        title: RMIT 12.1
        props:
        - name: label
          value: '12.1'
        - name: source-page
          value: '33'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-12.1_smt
          name: statement
          prose: 'Securing digital services is an integral part of financial institution’s
            risk management. A financial institution must expand its CRF to implement
            robust technology security controls in providing digital services which
            assure the following: (a) adopt and regularly assess the minimum-security
            controls for respective delivery channels to ensure confidentiality and
            integrity of customer and counterparty information and transactions. Refer
            to Appendices 2, 3, 4 and 11; (b) proper authentication of users or devices
            and authorization of transactions to mitigate impersonation and fraud
            risk. Refer the minimum-security controls in Appendix 3; and (c) strong
            physical control and logical control measures.'
      - id: rmit-12.2
        class: standard
        title: RMIT 12.2
        props:
        - name: label
          value: '12.2'
        - name: source-page
          value: '33'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-12.2_smt
          name: statement
          prose: In the event that a financial institution has not yet implemented
            the digital services security controls specified under paragraph 12.1
            to 12.9, the financial institution must- (a) be ready to provide documented
            explanation of how alternatives measures or mitigations achieve equivalent
            or superior effectiveness; and (b) assume the liability of any fraud that
            occurs due to the gaps arise from the absence of the specified control.
            Digital Fraud Management and Customer Awareness
      - id: rmit-12.3
        class: standard
        title: RMIT 12.3
        props:
        - name: label
          value: '12.3'
        - name: source-page
          value: '33'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-12.3_smt
          name: statement
          prose: 'The complex and fast evolving digital fraud requires financial institutions
            to be vigilant against new fraud techniques and proactive in strengthening
            their cyber defence for customer protection. In line with paragraphs 11.2
            and 11.3, a financial institution must enhance its CRF as follows: (a)
            expand the scope of identification of cybersecurity threats and countermeasures
            to include customers’ mobile devices and access points; (b) adopt layered
            (defense-in-depth) security controls to protect the digital service application
            deployed to customers’ mobile devices and the relevant banking data contained
            in it; (c) perform continuous surveillance and monitoring to detect any
            exploitation of the digital service application deployed to customers’
            mobile devices and ensure the swift upgrade of security controls to mitigate
            new vulnerabilities; (d) establish clearly defined and effective incident
            handling procedures to assist customers to contain the potential damage
            resulting from a cybersecurity breach involving digital services; (e)
            formalise operational arrangement to enable swift coordinated response
            and rapid upgrade of countermeasures to defend against advanced fraud
            tactics if a financial institution relies on multiple business functions;
            (f) conduct regular review by senior management to ensure the effectiveness
            of digital fraud management and define threshold for escalation of countermeasures
            considering the actual impact to victims of digital fraud and emerging
            fraud environment; and (g) apprise the board on the outcome of management
            reviews to preserve public confidence in the security of digital services
            and mitigate reputation risk to the industry.'
      - id: rmit-12.4
        class: standard
        title: RMIT 12.4
        props:
        - name: label
          value: '12.4'
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-12.4_smt
          name: statement
          prose: A financial institution must ensure that its fraud detection capabilities
            and rules are updated in a timely manner upon detection of new fraud modus
            operandi in order to prevent fraudulent transactions or account takeover
            using stolen customer credentials. This must be supported by appropriate
            risk analytics to improve the accuracy of fraud detection, that includes
            continuous upgrade of fraud detection capabilities as specified in Appendix
            11 on Fraud Detection Standards.
      - id: rmit-12.5
        class: standard
        title: RMIT 12.5
        props:
        - name: label
          value: '12.5'
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-12.5_smt
          name: statement
          prose: A financial institution must mitigate any attendant risk arising
            from its delivery of digital services. This shall include- (a) adopt secure
            communication channel to mitigate risk of phishing. Compensating controls
            shall be adopted when using communication channel prone to phishing exploits
            ; (b) all customers must be properly informed in advance of new controls
            to ease adoption and minimise inconvenience; and (c) practical ways for
            customers to verify the authenticity of calls made by the financial institution
            or its appointed outsourced service providers.
      - id: rmit-12.6
        class: standard
        title: RMIT 12.6
        props:
        - name: label
          value: '12.6'
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-12.6_smt
          name: statement
          prose: A financial institution shall empower customers to mitigate digital
            fraud risks where it is reasonably practical. This shall include offering
            customer mechanisms to manage activation and de-activation of payment
            card for card-not-present and overseas transactions. This shall not absolve
            the financial institution from its liabilities, responsibilities and duty
            of care to ensure the security of its digital services.
      - id: rmit-12.7
        class: standard
        title: RMIT 12.7
        props:
        - name: label
          value: '12.7'
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-12.7_smt
          name: statement
          prose: Consumer competency is essential to strengthening the security of
            digital services. A financial institution must maintain continuous efforts
            to review and enhance the effectiveness of its awareness programmes, ensuring
            customers understand the risks of digital services fraud. This shall include-
            (a) continuous and timely updates of practical information on how to identify
            potential fraud, including specific information about new or common modus
            operandi; (b) clear explanation about new and existing security measures,
            such as how to verify genuine e-banking websites and mobile applications;
            (c) real-time alerts of possible risks when security measures are absent
            or have not yet been implemented; and (d) measures to further improve
            customer understanding and familiarisation with fraud risks and controls,
            such as through interactive simulations of security features etc.
      - id: rmit-12.8
        class: standard
        title: RMIT 12.8
        props:
        - name: label
          value: '12.8'
        - name: source-page
          value: '35'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-12.8_smt
          name: statement
          prose: 'A financial institution must provide convenient means for customers
            to report, suspend and re-activate their account swiftly in the event
            of a suspected fraud, where applicable. This shall require the financial
            institution to: (a) offer a secure self-service “kill switch” solution;
            (b) ensure that its contact centre is adequately resourced and operating
            effectively to provide prompt and adequate assistance to customers in
            distress; and (c) restore customer access to digital services within a
            reasonable timeframe upon validation.'
      - id: rmit-12.9
        class: standard
        title: RMIT 12.9
        props:
        - name: label
          value: '12.9'
        - name: source-page
          value: '35'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-12.9_smt
          name: statement
          prose: In addition to effective incident handling procedures, a financial
            institution must adopt additional measures to mitigate risk to customers
            arising from any incident involving potential fraud or compromise of customer
            data. This shall include- (a) heighten monitoring of affected customer
            accounts; (b) notify affected customers and provide them with the necessary
            information to apply mitigating measures and reduce the risk of fraud;
            and (c) revoke and re-issue affected user credentials or designated payment
            instruments, where there is a potential risk of exploitation due to compromised
            data or other fraudulent activity.
    - id: rmit-g-13
      class: rmit-section
      title: Technology Audits
      props:
      - name: label
        value: '13'
      controls:
      - id: rmit-13.1
        class: standard
        title: RMIT 13.1
        props:
        - name: label
          value: '13.1'
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-13.1_smt
          name: statement
          prose: A financial institution must ensure that the scope, frequency, and
            intensity of technology audits are commensurate with the complexity, sophistication
            and criticality of technology systems and applications.
      - id: rmit-13.2
        class: standard
        title: RMIT 13.2
        props:
        - name: label
          value: '13.2'
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-13.2_smt
          name: statement
          prose: A financial institution must establish annual review on its technology
            audit plan that provides appropriate frequency and coverage of critical
            technology services, third party service providers, material external
            system interfaces, delayed or prematurely terminated critical technology
            projects and post-implementation review of new or material enhancements
            of technology services.
      - id: rmit-13.3
        class: standard
        title: RMIT 13.3
        props:
        - name: label
          value: '13.3'
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-13.3_smt
          name: statement
          prose: A financial institution must ensure the internal audit function must
            have dedicated technology audit resources with specialised competencies
            and professionally certified. The technology audit resources shall be
            adequately conversant with the developing sophisticate of the financial
            institution’s technology systems, delivery channels and have sound knowledge
            in the areas audited.
      - id: rmit-13.4
        class: guidance
        title: RMIT 13.4
        props:
        - name: label
          value: '13.4'
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: G
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-13.4_smt
          name: statement
          prose: The technology audit resources may be enlisted to provide advice
            on compliance and adequacy of control processes during the planning and
            development phases of new major products, systems, adoption of third party
            service providers or technology operations. In such cases, the technology
            auditors participating in this capacity are expected to carefully consider
            whether such an advisory or consulting role can materially impair their
            independence or objectivity in performing post- implementation reviews
            of the products, systems and operations concerned.
    - id: rmit-g-14
      class: rmit-section
      title: External Party Assurance
      props:
      - name: label
        value: '14'
      controls:
      - id: rmit-14.1
        class: standard
        title: RMIT 14.1
        props:
        - name: label
          value: '14.1'
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-14.1_smt
          name: statement
          prose: A financial institution shall appoint a technically competent external
            service provider to carry out a production data centre resilience and
            risk assessment (DCRA). The assessment must consider all major risks and
            determine the current level of resilience of the production data centre.
            A financial institution must ensure the assessment is conducted at least
            once every three years or when there is a material change in the data
            centre infrastructure, whichever is earlier. The assessment shall, at
            a minimum, include a consideration of whether the requirements in paragraphs
            10.24 to 10.28 have been adhered to. For data centres managed by third
            party service providers, a financial institution shall only rely on independent
            third party assurance reports provided such reliance is consistent with
            the financial institution’s risk appetite and tolerance, and the independent
            assurance has considered similar risks and meets the requirements in this
            paragraph for conducting the DCRA. The designated board-level committee
            specified in paragraph 8.3 must deliberate the outcome of the assessment.
      - id: rmit-14.2
        class: standard
        title: RMIT 14.2
        props:
        - name: label
          value: '14.2'
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-14.2_smt
          name: statement
          prose: A financial institution shall appoint a technically competent external
            service provider to carry out regular network resilience and risk assessments
            (NRA) and set proportionate controls aligned with its risk appetite. The
            assessment must be conducted at least once in three years or whenever
            there is a material change in the network design, whichever is earlier.
            The assessment must consider all major risks and determine the current
            level of resilience. This shall include an assessment of the financial
            institution’s adherence to the requirements in paragraphs 10.36 to 10.43.
            The designated board-level committee specified in paragraph 8.3 must deliberate
            the outcome of the assessment.
    - id: rmit-g-15
      class: rmit-section
      title: Security Awareness and Education
      props:
      - name: label
        value: '15'
      controls:
      - id: rmit-15.1
        class: standard
        title: RMIT 15.1
        props:
        - name: label
          value: '15.1'
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-15.1_smt
          name: statement
          prose: A financial institution must provide adequate and regular technology
            and cybersecurity awareness education for all staff in undertaking their
            respective roles and measure the effectiveness of its education and awareness
            programs. This cybersecurity awareness education must be conducted at
            least annually and must reflect the evolving cyber threat landscape and
            emerging risks. Where appropriate, the financial institution shall also
            include its third party service providers in their relevant training as
            outlined in paragraph 10.48(i).
      - id: rmit-15.2
        class: standard
        title: RMIT 15.2
        props:
        - name: label
          value: '15.2'
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-15.2_smt
          name: statement
          prose: A financial institution must provide adequate and continuous training
            for staff involved in technology operations, cybersecurity and risk management
            in order to ensure that the staff are competent and suitably certified
            to effectively perform their roles and responsibilities.
      - id: rmit-15.3
        class: standard
        title: RMIT 15.3
        props:
        - name: label
          value: '15.3'
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-15.3_smt
          name: statement
          prose: A financial institution must provide its board members with regular
            training and information on technology developments to enable the board
            to effectively discharge its oversight role.
  - id: rmit-g-part-c
    class: rmit-part
    title: 'Part C: Regulatory Process'
    props:
    - name: label
      value: Part C
    groups:
    - id: rmit-g-16
      class: rmit-section
      title: Notification for Technology-Related Applications
      props:
      - name: label
        value: '16'
      controls:
      - id: rmit-16.1
        class: standard
        title: RMIT 16.1
        props:
        - name: label
          value: '16.1'
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-16.1_smt
          name: statement
          prose: A financial institution must notify the Bank in accordance with the
            requirements in paragraphs 16.2 to 16.7 prior to introducing new digital
            services or enhancement to existing digital services.
      - id: rmit-16.2
        class: standard
        title: RMIT 16.2
        props:
        - name: label
          value: '16.2'
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-16.2_smt
          name: statement
          prose: 'A financial institution offering digital services for the first
            time must undertake measures specified under paragraph 16.4 and submit
            the following information in the notification to the Bank: (a) assessment
            on the risks identified and strategies to manage such risks. This includes
            specific accountabilities, policies and controls to address risks; (b)
            security arrangements and controls; (c) significant terms and conditions;
            (d) client charter; (e) privacy policy statement; and (f) any outsourcing
            or website link arrangements, or strategic alliances or partnerships with
            third parties that have been finalised.'
      - id: rmit-16.3
        class: standard
        title: RMIT 16.3
        props:
        - name: label
          value: '16.3'
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-16.3_smt
          name: statement
          prose: 'For any enhancements to existing digital services which meet the
            criteria in Appendix 6, a financial institution shall be subject to a
            simplified notification requirement and submit the following information
            in the notification to the Bank: (a) description of the enhancements to
            the existing technologies; and (b) risk assessment of the proposed enhancements,
            including the impact and measures to mitigate identified risks.'
      - id: rmit-16.4
        class: standard
        title: RMIT 16.4
        props:
        - name: label
          value: '16.4'
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-16.4_smt
          name: statement
          prose: 'For any enhancements to existing digital services which are not
            subject to the simplified notification requirement under paragraph 16.3,
            a financial institution is required to undertake the following measures
            prior to notifying the Bank: (a) engage an independent external party
            to provide assurance that the financial institution has addressed the
            technology risks and security controls associated with the digital services
            or any material enhancement to the digital services. The format of the
            assurance shall be as set out in Part A of Appendix 7; and (b) provide
            a confirmation by the CISO, senior management officer or the chairman
            of the board or designated board-level committee specified in paragraph
            8.3 of the financial institution’s readiness to provide digital services
            or implement any material enhancement to the digital services. The format
            of the confirmation shall be as set out in Part B of Appendix 7.'
      - id: rmit-16.5
        class: standard
        title: RMIT 16.5
        props:
        - name: label
          value: '16.5'
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-16.5_smt
          name: statement
          prose: A financial institution must ensure that the independent external
            party providing the assurance is competent and has a good track record.
            The assurance shall address the matters covered in, and comply with, Part
            C and D of Appendix 7.
      - id: rmit-16.6
        class: standard
        title: RMIT 16.6
        props:
        - name: label
          value: '16.6'
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-16.6_smt
          name: statement
          prose: A financial institution shall provide relevant documents for the
            Bank’s review when required by the Bank.
      - id: rmit-16.7
        class: guidance
        title: RMIT 16.7
        props:
        - name: label
          value: '16.7'
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: G
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-16.7_smt
          name: statement
          prose: A financial institution may offer digital services or implement any
            enhancement to the digital services immediately upon submission of the
            notification under paragraph 16.1 and compliance with the requirements
            in paragraphs 16.2 to 16.6.
    - id: rmit-g-17
      class: rmit-section
      title: Consultation and Notification related to Cloud Services and Emerging
        Technology
      props:
      - name: label
        value: '17'
      controls:
      - id: rmit-17.1
        class: standard
        title: RMIT 17.1
        props:
        - name: label
          value: '17.1'
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-17.1_smt
          name: statement
          prose: 'A financial institution is required to consult the Bank prior to
            the first-time adoption of a public cloud or emerging technology for critical
            systems. During the consultation, the financial institution must demonstrate
            that specific risks associated with the use of these technologies have
            been adequately considered and addressed to the satisfaction of the Bank,
            in order to proceed with the adoption of the public cloud for critical
            systems for the first time. The financial institution shall undertake
            the following prior to consulting the Bank on its adoption of public cloud
            for critical systems: (a) conduct a comprehensive risk assessment of the
            proposed cloud adoption or emerging technology, including the possible
            impact and measures to address and mitigate the identified risks. For
            public cloud, the assessment must follow the risk outlined in paragraph
            10.50 and Appendix 10. For emerging technology, it must follow the guideline
            in Appendix 9. The financial institution shall also adopt the format of
            the Risk Assessment Report as per Part A of Appendix 7; (b) provide a
            confirmation by the CISO, senior management officer or the chairman of
            the board or designated board-level committee specified in paragraph 8.3
            of the financial institution’s readiness to adopt public cloud or emerging
            technology for critical system. The format of the confirmation shall be
            as set out in Part B of Appendix 7; and (c) perform a third party pre-implementation
            review on public cloud or emerging technology. This review shall encompass
            the areas set out in Appendix 10 (for public cloud) or Appendix 9 (for
            emerging technology) and Part C of Appendix 7 for higher-risk services,
            such as those involving the processing or storage of customer information,
            or cross-border data transmission.'
      - id: rmit-17.2
        class: standard
        title: RMIT 17.2
        props:
        - name: label
          value: '17.2'
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-17.2_smt
          name: statement
          prose: 'A financial institution shall notify the Bank on any subsequent
            adoption of a public cloud or emerging technology for critical system,
            by submitting the notification together with the necessary updates to
            all the information required under paragraph 17.1, subject to the financial
            institution having complied with the following requirements and included
            documentation and information to demonstrate such compliance in the notification
            submitted to the Bank that the financial institution: (a) has consulted
            the Bank prior to adopting a public cloud or emerging technology for critical
            systems for the first time in accordance with paragraph 17.1, with no
            concerns raised by the Bank during the first- time consultation; (b) has
            enhanced the technology risk management framework to manage cloud or emerging
            technology risks; (c) has established independent assurance on the cloud
            risk management framework or emerging technology risk management framework;
            and (d) has provided assurance to the Bank that the incident response
            plans are sufficient to cater for adverse or unexpected events.'
      - id: rmit-17.3
        class: guidance
        title: RMIT 17.3
        props:
        - name: label
          value: '17.3'
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: G
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-17.3_smt
          name: statement
          prose: For the avoidance of doubt, notification to the Bank under paragraph
            17.2 is not required for any enhancement to existing cloud adoption and
            emerging technology adoption that does not materially alter t he prior
            assessments and representations made by a financial institution to the
            Bank .
      - id: rmit-17.4
        class: standard
        title: RMIT 17.4
        props:
        - name: label
          value: '17.4'
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-17.4_smt
          name: statement
          prose: The Bank may at its discretion direct a financial institution to
            consult the Bank under paragraph 17.1, notify the Bank under paragraph
            17.2 or observe any of the guidance in Appendix 10 or Appendix 9 and to
            explain any deviations from the guidance in Appendix 10 or Appendix 9,
            including for a non-critical system or when the pre-requisites in the
            paragraphs 17.1 or 17.2 have not been met. A financial institution must
            comply with such a directive promptly and to the satisfaction of the Bank.
      - id: rmit-17.5
        class: standard
        title: RMIT 17.5
        props:
        - name: label
          value: '17.5'
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-17.5_smt
          name: statement
          prose: A financial institution must ensure the roadmap for adoption of cloud
            services or emerging technology (for critical systems and non-critical
            systems) is included in the annual outsourcing plan submitted to the Bank
            in adherence with the requirements in the policy document on Outsourcing
            or IT Profile reporting. The risk assessment as outlined in paragraph
            10.50 for cloud services or Appendix 9 for emerging technology must also
            be documented and made available for the Bank’s review as and when requested
            by the Bank.
    - id: rmit-g-18
      class: rmit-section
      title: Assessment and Gap Analysis
      props:
      - name: label
        value: '18'
      controls:
      - id: rmit-18.1
        class: standard
        title: RMIT 18.1
        props:
        - name: label
          value: '18.1'
        - name: source-page
          value: '42'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-18.1_smt
          name: statement
          prose: A financial institution must perform a gap analysis of existing practices
            in managing technology risk against the requirements in this policy document
            and highlight key implementation gaps. The financial institution must
            develop an action plan with a clear timeline and key milestones to address
            the gaps identified. The gap analysis and action plan must be submitted
            to the Bank no later than 90 days after the issuance date of this policy
            document. Financial institutions that have previously made a submission
            in accordance with the equivalent provision in the previous version of
            this policy document are required to maintain continuous compliance by
            identifying any new gaps against the enhanced or revised requirements
            in the latest version of this policy document and taking the necessary
            steps to address such gaps. The updated annual assessment of its level
            of compliance must be made available to the Bank upon request.
      - id: rmit-18.2
        class: standard
        title: RMIT 18.2
        props:
        - name: label
          value: '18.2'
        - name: source-page
          value: '42'
          ns: https://baden.id/ns/rmit
        - name: marker
          value: S
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-18.2_smt
          name: statement
          prose: The self-assessment, gap analysis and action plan in paragraph 18.1
            must be submitted to Jabatan Penyeliaan Konglomerat Kewangan, Jabatan
            Penyeliaan Perbankan, Jabatan Penyeliaan Insurans dan Takaful or Jabatan
            Pemantauan Perkhidmatan Pembayaran, as the case may be.
