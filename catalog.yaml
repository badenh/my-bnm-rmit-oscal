    - uuid: 1089a438-a5fc-5735-9189-07d270831ae1
      title: Fraud Detection Standards
      description: 'A financial institution is required to adhere to the specified
        requirements, which include carrying out financial transactions conducted
        via digital services for retail customer. While compliance with the minimum
        standards is essential, a financial institution is encouraged to exceed these
        standards to stay ahead of emerging threat. The financial institution shall
        continuously upgrade and refine their fraud detection capability to ensure
        it remains robust against the anticipated level of threat. 1. A financial
        institution must establish detailed and comprehensive risk profiles for each
        customer as a reference point when performing fraud detection based on behavioural
        analysis of the financial institution’s customer and fraud profiles. Examples
        of relevant factors to be considered may include: (a) demographics information
        e.g. age, gender, race, occupation, salary, language, etc; (b) geographical
        information e.g. city, state, countries, IP address; (c) historical transactional
        patterns '
