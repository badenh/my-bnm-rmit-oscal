    props:
    - name: label
      value: Part A
    groups:
    - id: rmit-g-1
      class: rmit-section
      title: Introduction
      props:
      - name: label
        value: '1'
      controls:
      - id: rmit-1.1
        class: provision
        title: RMIT 1.1
        props:
        - name: label
          value: '1.1'
        - name: source-page
          value: '3'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-1.1_smt
          name: statement
          prose: With the prevalent use of technology in the provision of financial
            services, financial institutions must- (a) invest in the required expertise
            and risk controls to prevent operational disruptions given the complexity
            of Information Technology (IT) systems; (b) achieve the highest level
            of security to combat fast-changing digital crimes for public confidence;
            (c) maintain robust oversight to prevent transmission of risks with increased
            third party interlinkages; (d) build operational resilience against sophisticated
            and malicious cyber threats amidst heightened cyber risks globally; and
            (e) practice ethical and responsible use of technology for inclusive growth.
      - id: rmit-1.2
        class: provision
        title: RMIT 1.2
        props:
        - name: label
          value: '1.2'
        - name: source-page
          value: '3'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-1.2_smt
          name: statement
          prose: This policy document sets out the Bank’s policy objectives and minimum
            requirements to improve financial institutions’ management of technology
            risk, including cyber risk. In applying this policy document, a financial
            institution shall have regard to the size and complexity of its operations,
            the level of technology use and its external stress exposure. Accordingly,
            larger and more complex financial institutions, or those with a high degree
            of digitalisation and linkages with third parties, are required to adopt
            more robust risk controls that commensurate with the increased technology
            risk exposure of the institution.
      - id: rmit-1.3
        class: provision
        title: RMIT 1.3
        props:
        - name: label
          value: '1.3'
        - name: source-page
          value: '3'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-1.3_smt
          name: statement
          prose: Enforcement or supervisory actions can be taken against the financial
            institutions including its directors, officers and employees for any non-
            compliance with any provision marked as “S” in Part B of this policy document.
      - id: rmit-1.4
        class: provision
        title: RMIT 1.4
        props:
        - name: label
          value: '1.4'
        - name: source-page
          value: '3'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-1.4_smt
          name: statement
          prose: Where the Bank considers that a financial institution’s technology
            risk management has material weaknesses which, if not promptly and effectively
            addressed, might contribute to, or result in, non-compliance with this
            policy document, the Bank may, among others- (a) require an independent
            external review of the overall or specific areas of the financial institution’s
            technology risk management; (b) require the financial institution to develop
            and implement specific remediation plan; (c) require the financial institution
            to hold additional capital; or (d) require the financial institution to
            take any other corrective action necessary to rectify the weaknesses in
            a sustainable manner.
    - id: rmit-g-2
      class: rmit-section
      title: Applicability
      props:
      - name: label
        value: '2'
      controls:
      - id: rmit-2.1
        class: provision
        title: RMIT 2.1
        props:
        - name: label
          value: '2.1'
        - name: source-page
          value: '3'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-2.1_smt
          name: statement
          prose: Subject to paragraph 2.2, this policy document is applicable to all
            financial institutions as defined in paragraph 5.2.
      - id: rmit-2.2
        class: provision
        title: RMIT 2.2
        props:
        - name: label
          value: '2.2'
        - name: source-page
          value: '3'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-2.2_smt
          name: statement
          prose: 'The following paragraphs and appendices are not applicable to certain
            financial institutions identified below: (a) Part C (paragraphs 16 to
            17) and Appendices 6 and 7 are not applicable to- (i) operators of designated
            payment system; (ii) eligible e-money issuers; (iii) non-bank registered
            merchant acquirers; and (iv) intermediary remittance institutions; and
            (b) paragraphs 12.3 to 12.9 are not applicable to- (i) operators of designated
            payment system; and (ii) intermediary remittance institutions; and (c)
            paragraph 13.3 is not applicable to the following financial institutions,
            provided they have not been designated as National Critical Information
            Infrastructure (NCII) entities : (i) eligible e-money issuers; (ii) non-bank
            registered merchant acquirers; and (iii) intermediary remittance institutions.'
    - id: rmit-g-3
      class: rmit-section
      title: Legal provisions
      props:
      - name: label
        value: '3'
      controls:
      - id: rmit-3.1
        class: provision
        title: RMIT 3.1
        props:
        - name: label
          value: '3.1'
        - name: source-page
          value: '4'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-3.1_smt
          name: statement
          prose: The requirements in this policy document are specified pursuant to-
            (a) sections 47(1), 47(2)(d) and 143(2) of the Financial Services Act
            2013 (FSA); (b) sections 57(1), 57(2)(d) and 155(2) of the Islamic Financial
            Services Act 2013 (IFSA); (c) sections 41(1), 41(2)(b) and 116(1) of the
            Development Financial Institutions Act 2002 (DFIA); and (d) sections 34(2)
            and 74 of the Money Services Business Act 2011 (MSBA).
      - id: rmit-3.2
        class: provision
        title: RMIT 3.2
        props:
        - name: label
          value: '3.2'
        - name: source-page
          value: '4'
          ns: https://baden.id/ns/rmit
        parts:
        - id: rmit-3.2_smt
          name: statement
          prose: The guidance in this policy document is issued pursuant to section
            266 of the FSA, section 277 of the IFSA, section 126 of the DFIA and section
            74 of the MSBA.
    - id: rmit-g-4
      class: rmit-section
      title: Effective date
      props:
      - name: label
        value: '4'
      controls:
      - id: rmit-4.1
        class: provision
